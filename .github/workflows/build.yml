name: Build Friends Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app source ZIP
        run: unzip -o FriendsChat-Android-Starter.zip

      - name: Set Java and Kotlin targets
        shell: bash
        run: |
          cat > FriendsChat/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.friendschat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.friendschat"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          echo "Checking Android Gradle configuration..."
          grep -A 2 "compileOptions" FriendsChat/app/build.gradle.kts
          grep -A 2 "kotlinOptions" FriendsChat/app/build.gradle.kts

      - name: Build Android APK
        run: gradle -p FriendsChat :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsChat-debug
          path: FriendsChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
