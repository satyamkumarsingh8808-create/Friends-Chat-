name: Build Friends Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app source ZIP
        run: unzip -o FriendsChat-Android-Starter.zip

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("FriendsChat/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit(f"Build file not found: {p}")

          s = p.read_text()
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace("jvmTarget = \"1.8\"", "jvmTarget = \"17\"")
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          p.write_text(s)

          print("Updated Java and Kotlin target settings where matched.")
          print(s)
          PY

      - name: Build Android APK
        run: gradle -p FriendsChat :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsChat-debug
          path: FriendsChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
