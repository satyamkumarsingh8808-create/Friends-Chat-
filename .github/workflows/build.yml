name: Build Friends Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app source ZIP
        run: unzip -o FriendsChat-Android-Starter.zip
- name: Force Java and Kotlin JVM 17
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("FriendsChat/app/build.gradle.kts")
          s = p.read_text()

          s += """

          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = JavaVersion.VERSION_17.toString()
              targetCompatibility = JavaVersion.VERSION_17.toString()
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build Android APK
        run: gradle -p FriendsChat :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsChat-debug
          path: FriendsChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
